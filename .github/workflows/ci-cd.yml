name: "CI/CD Testing"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: "Use Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Syntax check"
        run: |
          node --check index.js
          node --check scheduler.js
          node --check commands/event.js
          node --check config.js
          node --check logger.js
          node --check embeds.js
          node --check backup.js
          node --check rateLimit.js
          node --check data/database.js
          node --check data/events.js

      - name: "Lint code"
        run: echo "Linting configuration would go here"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"
      - name: "Install dependencies"
        run: npm ci
      - name: "Audit dependencies"
        run: npm audit --audit-level=moderate || true
