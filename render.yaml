# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: eos-support-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: BACKUP_INTERVAL_HOURS
        value: "24"
      - key: RATE_LIMIT_COOLDOWN_MS
        value: "5000"
      - key: CHECK_INTERVAL_MS
        value: "60000"
      - key: STATS_TOKEN
        sync: false
